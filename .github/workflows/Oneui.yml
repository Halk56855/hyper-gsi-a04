name: Compress File to Absolute Max Size

on:
  workflow_dispatch:

jobs:
  compress-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file from Pixeldrain
        run: |
          echo "جاري تحميل الملف..."
          wget -O target_file "https://pixeldrain.com/api/file/hExUyqg7?download"
          ls -lh target_file

      - name: Compress with Extreme Settings (Max Dictionary & Ultra)
        run: |
          echo "جاري تطبيق الضغط الأقصى مع قاموس ضخم..."
          # -mx=9: أعلى مستوى ضغط
          # -m0=LZMA2:d1536m: رفع حجم القاموس إلى 1536 ميجابايت (1.5GB) للبحث عن تكرارات أوسع
          # -ms=on: تفعيل الأرشيف الصلب
          7z a -t7z -mx=9 -m0=LZMA2:d1536m -ms=on compressed_archive.7z target_file
          ls -lh compressed_archive.7z

      - name: Upload compressed archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-compressed-archive
          path: compressed_archive.7z
          retention-days: 1 # تم تصحيح الكلمة لتجنب التحذير السابق
