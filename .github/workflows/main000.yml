name: Complete ROM Porting Pipeline with Variants & 7z

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'ROM Variant'
        required: true
        default: 'ultra_lite'
        type: string

jobs:
  build-rom:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          p7zip-full aria2 python3 git wget curl bc rsync \
          build-essential zip unzip libssl-dev

    # ضع هنا خطوات بناء أو تعديل الروم الخاصة بك (توليد ملفات النظام/الصور)
    - name: Build / Port ROM
      run: |
        echo "[-] Starting ROM porting process..."
        mkdir -p out
        # (استبدل هذا السطر بأوامر بناء أو تجميع الروم الفعلية الخاصة بك)
        # مثال وهمي لتوليد ملف كبير للتجربة:
        # dd if=/dev/zero of=out/system.img bs=1M count=5300

    - name: Compress and Split ROM into 1GB parts
      run: |
        echo "[-] Starting maximum compression (-mx=9) and splitting into 1GB parts (-v1g)..."
        
        # انتقل للمجلد الذي يوجد به ملف الروم الناتج (عدل المسار حسب مشروعك)
        cd out
        
        # أمر 7z للضغط بأقصى قوة (-mx=9) والتقسيم إلى أجزاء 1GB (-v1g)
        # سيتم إنتاج ملفات مثل: ROM-a04-ultra_lite.7z.001, ROM-a04-ultra_lite.7z.002, ...
        7z a -t7z -mx=9 -v1g ROM-a04-ultra_lite.7z system.img

    - name: Upload Split ROM Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ROM-a04-ultra_lite-parts
        path: |
          out/ROM-a04-ultra_lite.7z.*
        compression-level: 0
