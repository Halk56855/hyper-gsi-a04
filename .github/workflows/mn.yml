name: Mount, Clean Bloatware and Compress GSI

on:
  workflow_dispatch:

jobs:
  clean-and-compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full android-sdk-libsparse-utils

      - name: Download GSI Zip from Pixeldrain
        run: |
          echo "جاري تحميل الملف..."
          curl -L "https://pixeldrain.com/api/file/mMTbBQQw?download" -o input_file.zip
          ls -lh input_file.zip

      - name: Extract ZIP (IMG file only)
        run: |
          echo "جاري فك الأرشيف لاستخراج ملف الـ IMG..."
          mkdir -p extracted_img
          unzip input_file.zip -d extracted_img/
          ls -lh extracted_img/

      - name: Mount, Remove Bloatware, and Compress Directly
        run: |
          IMG_FILE=$(find extracted_img -name "*.img" | head -n 1)
          if [ -z "$IMG_FILE" ]; then
            echo "لم يتم العثور على ملف img!"
            exit 1
          fi
          
          echo "تم العثور على الملف: $IMG_FILE"
          
          # تحويل الملف من Sparse إلى Raw إذا تطلب الأمر ليتوافق مع الـ mount
          simg2img "$IMG_FILE" "$IMG_FILE.raw" 2>/dev/null && mv "$IMG_FILE.raw" "$IMG_FILE" || true
          
          sudo mkdir -p /mnt/gsi_mount
          
          echo "جاري ربط ملف الـ IMG بصلاحيات القراءة والكتابة (rw) لتنظيف التطبيقات..."
          sudo mount -o loop,rw "$IMG_FILE" /mnt/gsi_mount
          
          echo "تحديد المسار الصحيح للنظام داخل الـ Mount..."
          SYS_PATH="/mnt/gsi_mount/system"
          [ -d "/mnt/gsi_mount/system/system" ] && SYS_PATH="/mnt/gsi_mount/system/system"
          
          echo "مسار النظام المحدد: $SYS_PATH"
          
          # --- خطوة إزالة التطبيقات الزائدة بأمان ---
          echo "جاري تنظيف وحذف التطبيقات غير الضرورية..."
          
          # 1. إزالة تطبيقات سامسونج غير الضرورية (مثل Bixby أو ARZone أو SmartThings - اختياري)
          sudo rm -rf "$SYS_PATH/app/BixbyService" 2>/dev/null || true
          sudo rm -rf "$SYS_PATH/priv-app/Bixby" 2>/dev/null || true
          sudo rm -rf "$SYS_PATH/app/ARZone" 2>/dev/null || true
          sudo rm -rf "$SYS_PATH/app/SmartThings" 2>/dev/null || true
          
          # 2. إزالة تطبيقات جوجل الإضافية التي يمكن الاستغناء عنها
          sudo rm -rf "$SYS_PATH/app/Books" 2>/dev/null || true
          sudo rm -rf "$SYS_PATH/app/Videos" 2>/dev/null || true
          sudo rm -rf "$SYS_PATH/app/YouTubeMusic" 2>/dev/null || true
          sudo rm -rf "$SYS_PATH/product/app/GoogleDuo" 2>/dev/null || true
          
          echo "تم الانتهاء من إزالة التطبيقات وتخفيف النظام بنجاح."
          
          echo "جاري ضغط الملفات مباشرة من مسار الـ Mount..."
          7z a -t7z -mx=9 -m0=lzma2 -md=512m -ms=on optimized_cleaned_gsi.7z /mnt/gsi_mount/*
          
          echo "فك الربط (Unmount)..."
          sudo umount /mnt/gsi_mount
          
          ls -lh optimized_cleaned_gsi.7z

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-and-compressed-gsi
          path: optimized_cleaned_gsi.7z
          retention-days: 3
